services:
  backend:
    # Apply pending migrations before starting the dev server. Without this the
    # override would replace the Dockerfile CMD and no tables would be created.
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist

  frontend:
    command: npm run dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
